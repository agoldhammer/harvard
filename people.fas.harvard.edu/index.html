<!DOCTYPE html>
<html lang="en">
<!-- Created on: 7/24/2007 · rebuilt 2026 -->

<!--
	The page itself is not here. It lives in docs/content.html, which
	tools/encode-content.py turns into docs/content.enc; docs/gate.js decodes
	that and injects it below, once the visitor has answered the challenge.

	To change the page, edit docs/content.html and run ./tools/encode-content.py.
-->

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="author" content="Arthur Goldhammer" />
	<meta name="keywords"
		content="France, history, politics, political theory, Tocqueville, Arthur Goldhammer, Harvard, MIT, translation, Guggenheim" />
	<meta name="description"
		content="Devoted to the work of Arthur Goldhammer on France, politics, Tocqueville, etc." />
	<title>Arthur Goldhammer</title>
	<link rel="preload" href="docs/fonts/spectral-200-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="docs/fonts/spectral-400-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="docs/base.css">
	<link rel="stylesheet" href="docs/harvard.css">
	<link rel="stylesheet" href="docs/gate.css">
</head>

<body>

	<!-- Unhidden by gate.js, so that a visitor with scripting off is shown the
	     noscript slip below rather than a form that cannot work. -->
	<div class="gate" id="gate" hidden>
		<div class="gate-slip">
			<h1 class="gate-label">Before continuing</h1>
			<p class="gate-question" id="gate-question"></p>
			<form class="gate-form" id="gate-form">
				<label class="gate-vh" for="gate-answer">Your answer</label>
				<input class="gate-input" id="gate-answer" type="text" inputmode="numeric" autocomplete="off"
					autocapitalize="off" autocorrect="off" spellcheck="false" required>
				<button class="gate-button" type="submit">Continue</button>
			</form>
			<p class="gate-note" id="gate-note" role="status" aria-live="polite"></p>
		</div>
	</div>

	<noscript>
		<div class="gate">
			<div class="gate-slip">
				<h1 class="gate-label">Before continuing</h1>
				<p class="gate-question">This page asks a short question before it opens, and the question needs
					JavaScript.</p>
				<!-- No mail address here: it would hand the harvesters the one
				     thing the gate is meant to keep from them. -->
				<p class="gate-note">Please turn scripting on for this site and reload.</p>
			</div>
		</div>
	</noscript>

	<div id="page"></div>

	<script src="docs/gate.js"></script>
</body>

</html>
